<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Required - Apex Procure</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #2563eb;
            --border: #eeeeee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }

        .logo {
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.02em;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--text-main);
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .status {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--text-muted);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading .spinner {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div class="logo">
            <div class="logo-icon">A</div>
            Apex Procure
        </div>
        <h1>Connection Required</h1>
        <p>Apex Procure requires an active internet connection to securely access your data and workflows.</p>
        
        <button class="btn" id="retry-btn">Retry Connection</button>
        
        <div class="status" id="status-box">
            <div class="spinner"></div>
            <span id="status-text">Disconnected</span>
        </div>
    </div>

    <script>
        const retryBtn = document.getElementById('retry-btn');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');

        retryBtn.addEventListener('click', () => {
            statusBox.classList.add('loading');
            statusText.innerText = 'Attempting to reconnect...';
            retryBtn.disabled = true;
            
            // This will trigger the Electron reload logic
            window.location.reload();
            
            // Brief timeout to reset UI if reload is slow
            setTimeout(() => {
                statusBox.classList.remove('loading');
                statusText.innerText = 'Connection failed. Please check your network.';
                retryBtn.disabled = false;
            }, 5000);
        });
    </script>
</body>
</html>
